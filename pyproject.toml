[project]
name = "firegrowth"
version = "0.1.0"
description = "Benchmark reproduzível para crescimento observado de eventos de fogo"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = ["duckdb>=1.1", "numpy>=1.26", "pandas>=2.1", "pyproj>=3.6", "pyyaml>=6", "shapely>=2.0"]

[project.scripts]
firegrowth = "firegrowth.cli:main"

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firegrowth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
